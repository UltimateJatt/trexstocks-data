name: Backtest

# Research only: tests the scoring rules on past prices and saves a report to
# data/backtest/. It never changes the website.
on:
  workflow_dispatch:
    inputs:
      quick:
        description: "Quick trial (200 stocks only)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Run the backtest
        run: |
          ARGS=""
          if [ "${{ inputs.quick }}" = "true" ]; then ARGS="--quick"; fi
          python -m pipeline.backtest $ARGS
      - name: Save the report
        run: |
          git config user.name "trexstocks-bot"
          git config user.email "trexstocks-bot@users.noreply.github.com"
          git add data/backtest
          if git diff --cached --quiet; then echo "no report"; exit 0; fi
          git commit -m "backtest report $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          exit 1
