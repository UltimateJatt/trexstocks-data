name: Daily prep

on:
  
  workflow_dispatch:
    inputs:
      force:
        description: "Also refresh the index member lists now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trexstocks-pipeline
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Prepare lists, fundamentals and price history
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m pipeline.run prep $ARGS
      - name: Save updated lists and data
        if: always()
        run: |
          git config user.name "trexstocks-bot"
          git config user.email "trexstocks-bot@users.noreply.github.com"
          git add data/state
          if [ -d data/lab ]; then git add data/lab; fi
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -m "data: daily prep $(date -u +%Y-%m-%d)"
          # If another run saved data while this one was working, keep this run's
          # newer files instead of stopping with a conflict. Try up to 3 times.
          for i in 1 2 3; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "Could not save data after 3 tries"
          exit 1
