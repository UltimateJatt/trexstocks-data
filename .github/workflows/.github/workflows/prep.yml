name: Daily prep

on:
  schedule:
    # 12:05 UTC = 8:05am Eastern in summer, 7:05am in winter. Weekdays only.
    - cron: "5 12 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Also refresh the index member lists now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: trexstocks-pipeline
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Prepare lists, fundamentals and price history
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="--force"; fi
          python -m pipeline.run prep $ARGS
      - name: Save updated lists and data
        if: always()
        run: |
          git config user.name "trexstocks-bot"
          git config user.email "trexstocks-bot@users.noreply.github.com"
          git add data/state
          if git diff --cached --quiet; then echo "no state changes"; exit 0; fi
          git commit -m "data: daily prep $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
